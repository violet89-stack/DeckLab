<html><head><meta charset="utf-8"><style>body{font:13px system-ui;margin:0;padding:16px;background:#f3f5f8;color:#172033}h2{font-size:16px;margin:0 0 6px}.sub{color:#65728a;font-size:11px;margin-bottom:16px}label{display:block;font-size:11px;font-weight:700;margin:11px 0 5px}input{width:100%;box-sizing:border-box;padding:8px;border:1px solid #cbd3df;border-radius:7px}button{margin-top:10px;width:100%;padding:9px;border:0;border-radius:7px;background:#26364f;color:white;font-weight:800}.msg{margin-top:12px;padding:8px;background:#e7edf6;border-radius:7px;font-size:10px;white-space:pre-wrap}</style></head><body><h2>DeckLab Live Demo</h2><div class="sub">Property Inspector → real plugin WebSocket → DeckLab host.</div><label>Message</label><input id="label" value="Hello from PI"><button id="send">Send to plugin</button><div id="msg" class="msg">Waiting for host…</div><script>let ws,ctx,action;window.connectElgatoStreamDeckSocket=(port,uuid,event,info,actionInfo)=>{ctx=uuid;const ai=JSON.parse(actionInfo);action=ai.action;ws=new WebSocket('ws://127.0.0.1:'+port);ws.onopen=()=>{ws.send(JSON.stringify({event,uuid}));document.getElementById('msg').textContent='Connected';};ws.onmessage=e=>document.getElementById('msg').textContent=e.data;};document.getElementById('send').onclick=()=>ws.send(JSON.stringify({event:'sendToPlugin',action,context:ctx,payload:{text:document.getElementById('label').value}}));</script></body></html>
